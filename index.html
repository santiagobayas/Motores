<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aventuras de Programación</title>
    <style>
        body { font-family: 'Comic Sans MS', cursive, sans-serif; background-color: #f0f8ff; color: #333; margin: 0; padding: 5px; text-align: center; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Menú */
        #selection-screen { margin-top: 10px; }
        .char-btn { font-size: 35px; padding: 10px 15px; margin: 5px; cursor: pointer; border-radius: 10px; border: 2px solid #b0c4de; background: white; }
        .menu-btn { font-size: 18px; padding: 10px 20px; margin: 10px; cursor: pointer; border-radius: 15px; border: 2px solid #4CAF50; background: #e8f5e9; font-weight: bold; }

        /* Pantalla Juego */
        #game-screen { display: none; height: 95vh; flex-direction: column; }
        .header-bar { background: #ffe0b2; padding: 5px 15px; border-radius: 10px; font-weight: bold; font-size: 18px; border: 2px solid #f39c12; margin-bottom: 5px; }
        
        .game-container { display: flex; gap: 10px; justify-content: center; align-items: stretch; height: 100%; position: relative; }
        .panel { flex: 0 0 280px; background: white; padding: 10px; border-radius: 10px; border: 2px solid #b0c4de; display: flex; flex-direction: column; text-align: left; }
        .board-container { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; background: white; padding: 10px; border-radius: 10px; border: 2px solid #b0c4de; }

        #commands { font-size: 18px; height: 40px; padding: 5px; background: #f9f9f9; border: 2px dashed #ccc; margin-bottom: 5px; }
        .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
        button { cursor: pointer; border-radius: 8px; border: none; background-color: #4CAF50; color: white; font-weight: bold; padding: 8px; }
        
        #game-board { display: grid; gap: 3px; justify-content: center; }
        .cell { width: 42px; height: 42px; background-color: #fff; border: 2px solid #b0c4de; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 26px; }
        
        #feedback-modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 10; font-size: 30px; font-weight: bold; color: #4CAF50; }
        #creator-tools { display: none; background: #f3e5f5; padding: 5px; border-radius: 10px; border: 2px solid #9c27b0; margin-bottom: 5px;}
        .tool-btn { font-size: 20px; padding: 2px 8px; background: white; border: 2px solid transparent;}
        .tool-btn.active { border-color: #9c27b0; background: #e1bee7; }
    </style>
</head>
<body>

    <h1>Aventuras de Programación</h1>

    <div id="selection-screen">
        <h2>¿Con quién quieres jugar hoy?</h2>
        <button class="char-btn" onclick="selectChar('🤖', '🔋')">🤖</button>
        <button class="char-btn" onclick="selectChar('🐱', '🐟')">🐱</button>
        <button class="char-btn" onclick="selectChar('🐶', '🦴')">🐶</button>
        <button class="char-btn" onclick="selectChar('👽', '🛸')">👽</button>
        <button class="char-btn" onclick="selectChar('🦄', '🌈')">🦄</button>
        <button class="char-btn" onclick="selectChar('🦖', '🥩')">🦖</button>
        <div>
            <button class="menu-btn" onclick="initGame(false)">▶️ JUGAR NIVELES</button>
            <button class="menu-btn" onclick="initGame(true)" style="border-color:#9c27b0; background:#f3e5f5;">🛠️ MODO CREADOR</button>
        </div>
    </div>

    <div id="game-screen">
        <div class="header-bar">
            <span id="level-title">Nivel 1</span> | Estrellas: <span id="score-display">0</span> ⭐
        </div>
        <div class="game-container">
            <div class="panel">
                <div id="commands"></div>
                <div id="creator-tools">
                    <button class="tool-btn active" onclick="setTool('player')" id="tool-player">🤖</button>
                    <button class="tool-btn" onclick="setTool('goal')" id="tool-goal">🔋</button>
                    <button class="tool-btn" onclick="setTool('rock')" id="tool-rock">🪨</button>
                    <button class="tool-btn" onclick="setTool('star')" id="tool-star">⭐</button>
                    <button class="tool-btn" onclick="setTool('eraser')" id="tool-eraser">🧹</button>
                </div>
                <div class="controls-grid">
                    <button onclick="addCommand('ARRIBA')">⬆️ Arriba</button>
                    <button onclick="addCommand('ABAJO')">⬇️ Abajo</button>
                    <button onclick="addCommand('IZQUIERDA')">⬅️ Izq</button>
                    <button onclick="addCommand('DERECHA')">➡️ Der</button>
                    <button onclick="deleteLastCommand()" style="background:#ff9800; grid-column: span 2;">🔙 Borrar</button>
                </div>
                <button onclick="runCommands()" style="background:#008CBA; padding:10px; margin-top:10px;">▶️ EJECUTAR</button>
                <button onclick="location.reload()" style="background:#607d8b; margin-top:5px;">🏠 Menú Principal</button>
            </div>
            <div class="board-container">
                <div id="game-board"></div>
                <div id="feedback-modal"></div>
            </div>
        </div>
    </div>

    <script>
        let pChar='🤖', gChar='🔋', totalScore=0, collected=0, isCreator=false, currentTool='player', curLvl=0;
        let pPos={x:0,y:0}, gPos={x:0,y:0}, obs=[], coins=[], cmds=[], isRunning=false;

        const levels = [
            {title:"Nivel 1: Inicio",size:5,s:{x:0,y:4},g:{x:4,y:0},o:[],c:[{x:2,y:2}]},
            {title:"Nivel 2: La roca",size:5,s:{x:0,y:4},g:{x:4,y:0},o:[{x:2,y:2}],c:[{x:1,y:2},{x:3,y:2}]},
            {title:"Nivel 3: El muro",size:6,s:{x:0,y:5},g:{x:5,y:0},o:[{x:2,y:1},{x:2,y:2},{x:2,y:3},{x:2,y:4}],c:[{x:1,y:0},{x:3,y:5}]},
            {title:"Nivel 4: S",size:6,s:{x:0,y:0},g:{x:5,y:5},o:[{x:1,y:0},{x:1,y:1},{x:1,y:2},{x:3,y:5},{x:3,y:4},{x:3,y:3}],c:[{x:2,y:0},{x:2,y:5}]},
            {title:"Nivel 5: U",size:6,s:{x:2,y:5},g:{x:2,y:1},o:[{x:1,y:2},{x:1,y:3},{x:1,y:4},{x:2,y:4},{x:3,y:4},{x:3,y:3},{x:3,y:2}],c:[{x:0,y:0},{x:4,y:0}]},
            {title:"Nivel 6: Puertas",size:6,s:{x:0,y:3},g:{x:5,y:3},o:[{x:2,y:0},{x:2,y:1},{x:2,y:4},{x:2,y:5},{x:4,y:1},{x:4,y:2},{x:4,y:4},{x:4,y:5}],c:[{x:2,y:2},{x:4,y:3}]},
            {title:"Nivel 7: Pasillo",size:7,s:{x:0,y:6},g:{x:6,y:0},o:[{x:1,y:1},{x:1,y:2},{x:1,y:3},{x:1,y:4},{x:1,y:5},{x:5,y:1},{x:5,y:2},{x:5,y:3},{x:5,y:4},{x:5,y:5}],c:[{x:3,y:1},{x:3,y:5}]},
            {title:"Nivel 8: ZigZag",size:7,s:{x:0,y:0},g:{x:6,y:6},o:[{x:1,y:0},{x:1,y:1},{x:1,y:2},{x:3,y:6},{x:3,y:5},{x:3,y:4},{x:5,y:0},{x:5,y:1},{x:5,y:2}],c:[{x:2,y:3},{x:4,y:3}]},
            {title:"Nivel 9: Caracol",size:7,s:{x:0,y:6},g:{x:3,y:3},o:[{x:1,y:4},{x:2,y:4},{x:3,y:4},{x:4,y:4},{x:5,y:4},{x:5,y:3},{x:5,y:2},{x:4,y:2},{x:3,y:2},{x:2,y:2},{x:2,y:3}],c:[{x:0,y:0},{x:6,y:0},{x:6,y:6}]},
            {title:"Nivel 10: Cruce",size:7,s:{x:3,y:6},g:{x:3,y:0},o:[{x:2,y:2},{x:2,y:3},{x:2,y:4},{x:4,y:2},{x:4,y:3},{x:4,y:4},{x:3,y:2},{x:3,y:4}],c:[{x:0,y:3},{x:6,y:3}]},
            {title:"Nivel 11: Caminos",size:7,s:{x:0,y:3},g:{x:6,y:3},o:[{x:2,y:3},{x:3,y:3},{x:4,y:3}],c:[{x:3,y:0},{x:3,y:6}]},
            {title:"Nivel 12: Diagonal",size:7,s:{x:0,y:6},g:{x:6,y:0},o:[{x:1,y:5},{x:2,y:4},{x:3,y:3},{x:4,y:2},{x:5,y:1}],c:[{x:1,y:6},{x:6,y:1}]},
            {title:"Nivel 13: Lluvia",size:7,s:{x:0,y:3},g:{x:6,y:3},o:[{x:1,y:1},{x:1,y:5},{x:2,y:3},{x:3,y:1},{x:3,y:5},{x:4,y:3},{x:5,y:1},{x:5,y:5}],c:[{x:2,y:1},{x:4,y:5}]},
            {title:"Nivel 14: Prisión",size:7,s:{x:3,y:3},g:{x:6,y:6},o:[{x:2,y:2},{x:3,y:2},{x:4,y:2},{x:2,y:3},{x:4,y:3},{x:2,y:4},{x:3,y:4},{x:4,y:4}],c:[{x:0,y:0},{x:6,y:0}]},
            {title:"Nivel 15: Final",size:7,s:{x:0,y:0},g:{x:6,y:6},o:[{x:0,y:1},{x:1,y:1},{x:2,y:1},{x:4,y:0},{x:4,y:1},{x:4,y:2},{x:4,y:3},{x:2,y:3},{x:2,y:4},{x:2,y:5},{x:3,y:5},{x:4,y:5},{x:6,y:5},{x:6,y:4}],c:[{x:0,y:6},{x:6,y:0},{x:3,y:3}]}
        ];

        function selectChar(c,g){pChar=c;gChar=g;document.getElementById('tool-player').innerText=c;document.getElementById('tool-goal').innerText=g;}
        function initGame(creator){isCreator=creator;document.getElementById('selection-screen').style.display='none';document.getElementById('game-screen').style.display='flex';isCreator?enterCreator():loadLevel();}
        function enterCreator(){document.getElementById('level-title').innerText="🛠️ Editor";document.getElementById('creator-tools').style.display='block';curLvl=0;setupBoard(7);draw();}
        function loadLevel(){const l=levels[curLvl];document.getElementById('level-title').innerText=l.title;pPos={...l.s};gPos={...l.g};obs=[...l.o];coins=[...l.c];collected=0;cmds=[];document.getElementById('commands').innerText='';document.getElementById('score-display').innerText=totalScore;setupBoard(l.size);draw();}
        function setupBoard(sz){const b=document.getElementById('game-board');b.style.gridTemplateColumns=`repeat(${sz}, 45px)`;b.style.gridTemplateRows=`repeat(${sz}, 45px)`;}
        function draw(crash=false){const b=document.getElementById('game-board');b.innerHTML='';for(let y=0;y<(isCreator?7:levels[curLvl].size);y++){for(let x=0;x<(isCreator?7:levels[curLvl].size);x++){let c=document.createElement('div');c.className='cell';c.onclick=()=>handle(x,y);if(x===pPos.x&&y===pPos.y)c.innerHTML=crash?'💥':pChar;else if(x===gPos.x&&y===gPos.y)c.innerHTML=gChar;else if(obs.some(o=>o.x===x&&o.y===y))c.innerHTML='🪨';else if(coins.some(i=>i.x===x&&i.y===y))c.innerHTML='⭐';b.appendChild(c);}}}
        function handle(x,y){if(!isCreator||isRunning)return;obs=obs.filter(o=>o.x!==x||o.y!==y);coins=coins.filter(i=>i.x!==x||i.y!==y);if(currentTool==='player')pPos={x,y};else if(currentTool==='goal')gPos={x,y};else if(currentTool==='rock')obs.push({x,y});else if(currentTool==='star')coins.push({x,y});draw();}
        function setTool(t){currentTool=t;document.querySelectorAll('.tool-btn').forEach(b=>b.classList.remove('active'));document.getElementById('tool-'+t).classList.add('active');}
        function addCommand(c){if(!isRunning){cmds.push(c);document.getElementById('commands').innerText=cmds.map(x=>{'ARRIBA':'⬆️','ABAJO':'⬇️','IZQUIERDA':'⬅️','DERECHA':'➡️'}[x]).join(' ');}}
        function deleteLastCommand(){cmds.pop();document.getElementById('commands').innerText=cmds.map(x=>{'ARRIBA':'⬆️','ABAJO':'⬇️','IZQUIERDA':'⬅️','DERECHA':'➡️'}[x]).join(' ');}
        function runCommands(){if(cmds.length===0||isRunning)return;isRunning=true;let i=0;let int=setInterval(()=>{if(i>=cmds.length){clearInterval(int);checkWin();return;}let c=cmds[i],nx=pPos.x,ny=pPos.y;if(c==='ARRIBA')ny--;if(c==='ABAJO')ny++;if(c==='IZQUIERDA')nx--;if(c==='DERECHA')nx++;let sz=isCreator?7:levels[curLvl].size;if(nx<0||nx>=sz||ny<0||ny>=sz||obs.some(o=>o.x===nx&&o.y===ny)){clearInterval(int);draw(true);setTimeout(()=>{isRunning=false;isCreator?pPos={x:0,y:6}:loadLevel();draw();},800);return;}pPos={x:nx,y:ny};let ci=coins.findIndex(i=>i.x===pPos.x&&i.y===pPos.y);if(ci!==-1){coins.splice(ci,1);collected++;document.getElementById('score-display').innerText=totalScore+collected;}draw();i++;},400);}
        function checkWin(){if(pPos.x===gPos.x && pPos.y===gPos.y){const m=document.getElementById('feedback-modal');m.style.display='flex';m.innerText='¡Ganaste!';setTimeout(()=>{m.style.display='none';if(!isCreator&&curLvl<levels.length-1){curLvl++;loadLevel();}else{alert('¡Completado!');isRunning=false;}},1000);}else{alert('No llegaste');isRunning=false;isCreator?pPos={x:0,y:6}:loadLevel();draw();}}
    </script>
</body>
</html>
