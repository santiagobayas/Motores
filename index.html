<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aventuras de Programación</title>
    <style>
        body { font-family: 'Comic Sans MS', cursive, sans-serif; background-color: #f0f8ff; color: #333; margin: 0; padding: 10px; text-align: center; height: 100vh; display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box;}
        
        /* Menú */
        #selection-screen { margin-top: 20px; flex: 1; }
        .char-btn { font-size: 45px; padding: 15px 25px; margin: 10px; cursor: pointer; border-radius: 15px; border: 3px solid #b0c4de; background: white; transition: 0.2s;}
        .char-btn.selected { border-color: #9c27b0; background: #f3e5f5; transform: scale(1.1);}
        .menu-btn { font-size: 22px; padding: 15px 30px; margin: 15px; cursor: pointer; border-radius: 15px; border: 2px solid #4CAF50; background: #e8f5e9; font-weight: bold; }

        /* Pantalla Juego */
        #game-screen { display: none; height: 100%; flex-direction: column; }
        .header-bar { background: #ffe0b2; padding: 10px 20px; border-radius: 10px; font-weight: bold; font-size: 22px; border: 2px solid #f39c12; margin-bottom: 10px; }
        
        .game-container { display: flex; gap: 15px; justify-content: center; align-items: stretch; flex: 1; position: relative; min-height: 0; }
        .panel { flex: 0 0 300px; background: white; padding: 15px; border-radius: 10px; border: 2px solid #b0c4de; display: flex; flex-direction: column; text-align: left; }
        .board-container { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; background: white; padding: 10px; border-radius: 10px; border: 2px solid #b0c4de; }

        #commands { font-size: 24px; height: 50px; padding: 8px; background: #f9f9f9; border: 2px dashed #ccc; margin-bottom: 10px; overflow-y: auto;}
        .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        button { cursor: pointer; border-radius: 8px; border: none; background-color: #4CAF50; color: white; font-weight: bold; padding: 10px; font-size: 16px; }
        
        #game-board { display: grid; gap: 4px; justify-content: center; }
        .cell { width: 65px; height: 65px; background-color: #fff; border: 2px solid #b0c4de; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 40px; user-select: none; }
        
        #feedback-modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 10; font-size: 40px; font-weight: bold; color: #4CAF50; border-radius: 10px;}
        #creator-tools { display: none; background: #f3e5f5; padding: 8px; border-radius: 10px; border: 2px solid #9c27b0; margin-bottom: 10px;}
        .tool-btn { font-size: 24px; padding: 4px 10px; background: white; border: 2px solid transparent; color: #000; box-shadow: none;}
        .tool-btn.active { border-color: #9c27b0; background: #e1bee7; }
        
        .nav-buttons { display: flex; flex-direction: column; gap: 8px; margin-top: auto;}
    </style>
</head>
<body>

    <h1>Aventuras de Programación</h1>

    <div id="selection-screen">
        <h2>1. Elige tu personaje:</h2>
        <button class="char-btn selected" id="btn-char-1" onclick="selectChar('🤖', '🔋', 'btn-char-1')">🤖</button>
        <button class="char-btn" id="btn-char-2" onclick="selectChar('🐱', '🐟', 'btn-char-2')">🐱</button>
        <button class="char-btn" id="btn-char-3" onclick="selectChar('🐶', '🦴', 'btn-char-3')">🐶</button>
        <button class="char-btn" id="btn-char-4" onclick="selectChar('👽', '🛸', 'btn-char-4')">👽</button>
        <button class="char-btn" id="btn-char-5" onclick="selectChar('🦄', '🌈', 'btn-char-5')">🦄</button>
        <button class="char-btn" id="btn-char-6" onclick="selectChar('🦖', '🥩', 'btn-char-6')">🦖</button>
        
        <h2 style="margin-top: 40px;">2. Elige cómo jugar:</h2>
        <div>
            <button class="menu-btn" onclick="initGame(false)">▶️ JUGAR NIVELES</button>
            <button class="menu-btn" onclick="initGame(true)" style="border-color:#9c27b0; background:#f3e5f5; color: #333;">🛠️ MODO CREADOR</button>
        </div>
    </div>

    <div id="game-screen">
        <div class="header-bar">
            <span id="level-title">Nivel 1</span> | Estrellas: <span id="score-display">0</span> ⭐
        </div>
        <div class="game-container">
            <div class="panel">
                <div id="commands"></div>
                
                <div id="creator-tools">
                    <p style="margin:0 0 5px 0; font-size:16px; font-weight:bold; color:#9c27b0;">Pinceles:</p>
                    <button class="tool-btn active" onclick="setTool('player')" id="tool-player">🤖</button>
                    <button class="tool-btn" onclick="setTool('goal')" id="tool-goal">🔋</button>
                    <button class="tool-btn" onclick="setTool('rock')" id="tool-rock">🪨</button>
                    <button class="tool-btn" onclick="setTool('star')" id="tool-star">⭐</button>
                    <button class="tool-btn" onclick="setTool('eraser')" id="tool-eraser">🧹</button>
                </div>
                
                <div class="controls-grid">
                    <button onclick="addCommand('ARRIBA')">⬆️ Arriba</button>
                    <button onclick="addCommand('ABAJO')">⬇️ Abajo</button>
                    <button onclick="addCommand('IZQUIERDA')">⬅️ Izquierda</button>
                    <button onclick="addCommand('DERECHA')">➡️ Derecha</button>
                    <button onclick="deleteLastCommand()" style="background:#ff9800; grid-column: span 2;">🔙 Borrar último paso</button>
                </div>
                
                <div class="nav-buttons">
                    <button onclick="runCommands()" style="background:#008CBA; padding:12px; font-size: 18px;">▶️ EJECUTAR</button>
                    <button onclick="resetCurrentState()" style="background:#f44336; padding:10px;">🔄 Reiniciar Nivel</button>
                    <button onclick="location.reload()" style="background:#607d8b; padding:10px;">🏠 Cambiar Personaje</button>
                </div>
            </div>
            
            <div class="board-container">
                <div id="game-board"></div>
                <div id="feedback-modal"></div>
            </div>
        </div>
    </div>

    <script>
        // Variables globales
        let pChar = '🤖', gChar = '🔋';
        let totalScore = 0, collected = 0, isCreator = false, currentTool = 'player', curLvl = 0;
        let pPos = {x:0, y:0}, gPos = {x:0, y:0};
        let obs = [], coins = [], cmds = [], isRunning = false;
        
        let creatorStartP = {x:0, y:6}, creatorStartG = {x:6, y:0};
        let creatorStartObs = [], creatorStartCoins = [];

        // 15 Niveles
        const levels = [
            {title:"Nivel 1: Inicio", size:5, s:{x:0,y:4}, g:{x:4,y:0}, o:[], c:[{x:2,y:2}]},
            {title:"Nivel 2: La roca", size:5, s:{x:0,y:4}, g:{x:4,y:0}, o:[{x:2,y:2}], c:[{x:1,y:2},{x:3,y:2}]},
            {title:"Nivel 3: El muro", size:6, s:{x:0,y:5}, g:{x:5,y:0}, o:[{x:2,y:1},{x:2,y:2},{x:2,y:3},{x:2,y:4}], c:[{x:1,y:0},{x:3,y:5}]},
            {title:"Nivel 4: S", size:6, s:{x:0,y:0}, g:{x:5,y:5}, o:[{x:1,y:0},{x:1,y:1},{x:1,y:2},{x:3,y:5},{x:3,y:4},{x:3,y:3}], c:[{x:2,y:0},{x:2,y:5}]},
            {title:"Nivel 5: U", size:6, s:{x:2,y:5}, g:{x:2,y:1}, o:[{x:1,y:2},{x:1,y:3},{x:1,y:4},{x:2,y:4},{x:3,y:4},{x:3,y:3},{x:3,y:2}], c:[{x:0,y:0},{x:4,y:0}]},
            {title:"Nivel 6: Puertas", size:6, s:{x:0,y:3}, g:{x:5,y:3}, o:[{x:2,y:0},{x:2,y:1},{x:2,y:4},{x:2,y:5},{x:4,y:1},{x:4,y:2},{x:4,y:4},{x:4,y:5}], c:[{x:2,y:2},{x:4,y:3}]},
            {title:"Nivel 7: Pasillo", size:7, s:{x:0,y:6}, g:{x:6,y:0}, o:[{x:1,y:1},{x:1,y:2},{x:1,y:3},{x:1,y:4},{x:1,y:5},{x:5,y:1},{x:5,y:2},{x:5,y:3},{x:5,y:4},{x:5,y:5}], c:[{x:3,y:1},{x:3,y:5}]},
            {title:"Nivel 8: ZigZag", size:7, s:{x:0,y:0}, g:{x:6,y:6}, o:[{x:1,y:0},{x:1,y:1},{x:1,y:2},{x:3,y:6},{x:3,y:5},{x:3,y:4},{x:5,y:0},{x:5,y:1},{x:5,y:2}], c:[{x:2,y:3},{x:4,y:3}]},
            {title:"Nivel 9: Caracol", size:7, s:{x:0,y:6}, g:{x:3,y:3}, o:[{x:1,y:4},{x:2,y:4},{x:3,y:4},{x:4,y:4},{x:5,y:4},{x:5,y:3},{x:5,y:2},{x:4,y:2},{x:3,y:2},{x:2,y:2},{x:2,y:3}], c:[{x:0,y:0},{x:6,y:0},{x:6,y:6}]},
            {title:"Nivel 10: Cruce", size:7, s:{x:3,y:6}, g:{x:3,y:0}, o:[{x:2,y:2},{x:2,y:3},{x:2,y:4},{x:4,y:2},{x:4,y:3},{x:4,y:4},{x:3,y:2},{x:3,y:4}], c:[{x:0,y:3},{x:6,y:3}]},
            {title:"Nivel 11: Caminos", size:7, s:{x:0,y:3}, g:{x:6,y:3}, o:[{x:2,y:3},{x:3,y:3},{x:4,y:3}], c:[{x:3,y:0},{x:3,y:6}]},
            {title:"Nivel 12: Diagonal", size:7, s:{x:0,y:6}, g:{x:6,y:0}, o:[{x:1,y:5},{x:2,y:4},{x:3,y:3},{x:4,y:2},{x:5,y:1}], c:[{x:1,y:6},{x:6,y:1}]},
            {title:"Nivel 13: Lluvia", size:7, s:{x:0,y:3}, g:{x:6,y:3}, o:[{x:1,y:1},{x:1,y:5},{x:2,y:3},{x:3,y:1},{x:3,y:5},{x:4,y:3},{x:5,y:1},{x:5,y:5}], c:[{x:2,y:1},{x:4,y:5}]},
            {title:"Nivel 14: Prisión", size:7, s:{x:3,y:3}, g:{x:6,y:6}, o:[{x:2,y:2},{x:3,y:2},{x:4,y:2},{x:2,y:3},{x:4,y:3},{x:2,y:4},{x:3,y:4},{x:4,y:4}], c:[{x:0,y:0},{x:6,y:0}]},
            {title:"Nivel 15: Final", size:7, s:{x:0,y:0}, g:{x:6,y:6}, o:[{x:0,y:1},{x:1,y:1},{x:2,y:1},{x:4,y:0},{x:4,y:1},{x:4,y:2},{x:4,y:3},{x:2,y:3},{x:2,y:4},{x:2,y:5},{x:3,y:5},{x:4,y:5},{x:6,y:5},{x:6,y:4}], c:[{x:0,y:6},{x:6,y:0},{x:3,y:3}]}
        ];

        function selectChar(c, g, btnId) {
            pChar = c; gChar = g;
            document.querySelectorAll('.char-btn').forEach(b => b.classList.remove('selected'));
            document.getElementById(btnId).classList.add('selected');
            document.getElementById('tool-player').innerText = c;
            document.getElementById('tool-goal').innerText = g;
        }

        function initGame(creatorMode) {
            isCreator = creatorMode;
            document.getElementById('selection-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            if(isCreator) { enterCreator(); } else { curLvl = 0; totalScore = 0; loadLevel(); }
        }

        function enterCreator() {
            document.getElementById('level-title').innerText = "🛠️ Editor Libre";
            document.getElementById('creator-tools').style.display = 'block';
            pPos = {x:0, y:6}; gPos = {x:6, y:0}; obs = []; coins = []; cmds = [];
            isRunning = false; // <-- CORRECCIÓN APLICADA AQUÍ
            creatorStartP = {...pPos}; creatorStartG = {...gPos}; creatorStartObs = []; creatorStartCoins = [];
            updateDisplay(); setupBoard(7); draw();
        }

        function loadLevel() {
            const l = levels[curLvl];
            document.getElementById('level-title').innerText = l.title;
            pPos = {...l.s}; gPos = {...l.g};
            obs = JSON.parse(JSON.stringify(l.o)); coins = JSON.parse(JSON.stringify(l.c));
            collected = 0; cmds = [];
            isRunning = false; // <-- ¡Y LA CORRECCIÓN PRINCIPAL AQUÍ! Desbloquea los botones al cargar nivel.
            document.getElementById('score-display').innerText = totalScore;
            updateDisplay(); setupBoard(l.size); draw();
        }

        function resetCurrentState() {
            if(isRunning) return;
            if(isCreator) {
                pPos = {...creatorStartP}; gPos = {...creatorStartG};
                obs = JSON.parse(JSON.stringify(creatorStartObs)); coins = JSON.parse(JSON.stringify(creatorStartCoins));
            } else {
                loadLevel();
            }
            cmds = []; updateDisplay(); draw();
        }

        function setupBoard(sz) {
            const b = document.getElementById('game-board');
            b.style.gridTemplateColumns = `repeat(${sz}, 65px)`;
            b.style.gridTemplateRows = `repeat(${sz}, 65px)`;
        }

        function draw(crash = false) {
            const b = document.getElementById('game-board');
            b.innerHTML = '';
            const sz = isCreator ? 7 : levels[curLvl].size;
            
            for(let y=0; y<sz; y++) {
                for(let x=0; x<sz; x++) {
                    let c = document.createElement('div');
                    c.className = 'cell';
                    if(isCreator && !isRunning) { c.style.cursor = 'pointer'; c.onclick = () => handleCellClick(x, y); }
                    if(x === pPos.x && y === pPos.y) c.innerHTML = crash ? '💥' : pChar;
                    else if(x === gPos.x && y === gPos.y) c.innerHTML = gChar;
                    else if(obs.some(o => o.x === x && o.y === y)) c.innerHTML = '🪨';
                    else if(coins.some(i => i.x === x && i.y === y)) c.innerHTML = '⭐';
                    b.appendChild(c);
                }
            }
        }

        function handleCellClick(x, y) {
            if(!isCreator || isRunning) return;
            obs = obs.filter(o => o.x !== x || o.y !== y);
            coins = coins.filter(i => i.x !== x || i.y !== y);
            if(currentTool === 'player') { pPos = {x, y}; } 
            else if(currentTool === 'goal') { gPos = {x, y}; } 
            else if(currentTool === 'rock') { if((x !== pPos.x || y !== pPos.y) && (x !== gPos.x || y !== gPos.y)) { obs.push({x, y}); } } 
            else if(currentTool === 'star') { if((x !== pPos.x || y !== pPos.y) && (x !== gPos.x || y !== gPos.y)) { coins.push({x, y}); } }
            draw();
        }

        function setTool(t) {
            currentTool = t;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tool-' + t).classList.add('active');
        }

        const mapSym = {'ARRIBA':'⬆️', 'ABAJO':'⬇️', 'IZQUIERDA':'⬅️', 'DERECHA':'➡️'};

        function addCommand(c) { if(!isRunning) { cmds.push(c); updateDisplay(); } }
        function deleteLastCommand() { if(!isRunning && cmds.length > 0) { cmds.pop(); updateDisplay(); } }
        function updateDisplay() { document.getElementById('commands').innerText = cmds.map(x => mapSym[x]).join(' '); }
        
        function showFeedback(msg, isSuccess) {
            const m = document.getElementById('feedback-modal');
            m.style.display = 'flex'; m.innerText = msg;
            m.style.color = isSuccess ? '#4CAF50' : '#f44336';
            setTimeout(() => { m.style.display = 'none'; }, 1500);
        }

        function runCommands() {
            if(cmds.length === 0 || isRunning) return;
            isRunning = true;
            if(isCreator) {
                creatorStartP = {...pPos}; creatorStartG = {...gPos};
                creatorStartObs = JSON.parse(JSON.stringify(obs)); creatorStartCoins = JSON.parse(JSON.stringify(coins));
            }
            
            let i = 0; collected = 0;
            let int = setInterval(() => {
                if(i >= cmds.length) { clearInterval(int); checkWin(); return; }
                let c = cmds[i]; let nx = pPos.x; let ny = pPos.y;
                if(c === 'ARRIBA') ny--; if(c === 'ABAJO') ny++; if(c === 'IZQUIERDA') nx--; if(c === 'DERECHA') nx++;
                
                let sz = isCreator ? 7 : levels[curLvl].size;
                
                if(nx < 0 || nx >= sz || ny < 0 || ny >= sz || obs.some(o => o.x === nx && o.y === ny)) {
                    clearInterval(int); draw(true); showFeedback("¡Oh no! Intenta de nuevo.", false);
                    setTimeout(() => { isRunning = false; resetCurrentState(); }, 1500); return;
                }
                
                pPos = {x: nx, y: ny};
                let ci = coins.findIndex(item => item.x === pPos.x && item.y === pPos.y);
                if(ci !== -1) { coins.splice(ci, 1); collected++; document.getElementById('score-display').innerText = totalScore + collected; }
                
                draw(); i++;
            }, 400);
        }

        function checkWin() {
            if(pPos.x === gPos.x && pPos.y === gPos.y) {
                showFeedback("¡Nivel Superado! 🎉", true);
                setTimeout(() => {
                    if(!isCreator) {
                        totalScore += collected;
                        if(curLvl < levels.length - 1) { curLvl++; loadLevel(); } 
                        else { alert('¡Completaste todos los niveles! Eres un maestro programador.'); location.reload(); }
                    } else { isRunning = false; resetCurrentState(); }
                }, 1500);
            } else {
                showFeedback("¡Te faltaron pasos!", false);
                setTimeout(() => { isRunning = false; resetCurrentState(); }, 1500);
            }
        }
    </script>
</body>
</html>
